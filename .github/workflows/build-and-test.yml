name: Build & Test

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: headband
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: headband_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Lint
      working-directory: ./backend
      run: npm run lint
    
    - name: Build
      working-directory: ./backend
      run: npm run build
    
    - name: Setup test database
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://headband:testpass@localhost:5432/headband_test
      run: |
        npx prisma migrate deploy
        npx prisma db seed
    
    - name: Run tests
      working-directory: ./backend
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://headband:testpass@localhost:5432/headband_test
        REDIS_URL: redis://localhost:6379
      run: npm run test:cov
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/lcov.info
        flags: backend
        fail_ci_if_error: true

  test-worker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: worker/package-lock.json
    
    - name: Install dependencies
      working-directory: ./worker
      run: npm ci
    
    - name: Lint
      working-directory: ./worker
      run: npm run lint
    
    - name: Build
      working-directory: ./worker
      run: npm run build
    
    - name: Run tests
      working-directory: ./worker
      env:
        NODE_ENV: test
      run: npm run test:run
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./worker/coverage/lcov.info
        flags: worker
        fail_ci_if_error: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Check for high severity vulnerabilities
      run: |
        if grep -q '"severity":"HIGH"' trivy-results.sarif; then
          echo "High severity vulnerabilities found!"
          exit 1
        fi

  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Dependency check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        path: '.'
        format: 'JSON'
        args: >-
          --enableExperimental
          --enableVulnerability

  build-docker-images:
    needs: [ test-backend, test-worker, security-scan ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/headband-backend:latest
          ghcr.io/${{ github.repository_owner }}/headband-backend:${{ github.sha }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/headband-backend:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/headband-backend:buildcache,mode=max
    
    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/headband-frontend:latest
          ghcr.io/${{ github.repository_owner }}/headband-frontend:${{ github.sha }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/headband-frontend:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/headband-frontend:buildcache,mode=max
    
    - name: Build and push worker image
      uses: docker/build-push-action@v4
      with:
        context: ./worker
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/headband-worker:latest
          ghcr.io/${{ github.repository_owner }}/headband-worker:${{ github.sha }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/headband-worker:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/headband-worker:buildcache,mode=max
