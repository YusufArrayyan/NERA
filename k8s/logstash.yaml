---
# Logstash ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: logging
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    path.logs: /usr/share/logstash/logs
    log.level: info
    xpack.monitoring.enabled: true
    xpack.monitoring.elasticsearch.hosts: ["https://elasticsearch.logging.svc.cluster.local:9200"]
    xpack.monitoring.elasticsearch.username: "elastic"
    xpack.monitoring.elasticsearch.password: "${ELASTICSEARCH_PASSWORD}"
    xpack.monitoring.elasticsearch.ssl.verification_mode: none
  
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json
        type => "app-logs"
      }
      
      tcp {
        port => 5001
        type => "container-logs"
      }
      
      http {
        port => 5002
        codec => json
        type => "http-logs"
      }
      
      kubernetes {
        namespace => "_all_"
        type => "k8s-logs"
      }
    }
    
    filter {
      if [type] == "app-logs" {
        mutate {
          add_field => { "[@metadata][index_name]" => "app-logs-%{+YYYY.MM.dd}" }
          add_field => { "source" => "application" }
        }
      }
      
      if [type] == "container-logs" {
        grok {
          match => { "message" => "%{SYSLOGTIMESTAMP:timestamp} %{DATA:container_name} %{GREEDYDATA:log_message}" }
        }
        mutate {
          add_field => { "[@metadata][index_name]" => "container-logs-%{+YYYY.MM.dd}" }
          add_field => { "source" => "container" }
          remove_field => ["message"]
          rename => { "log_message" => "message" }
        }
      }
      
      if [type] == "http-logs" {
        mutate {
          add_field => { "[@metadata][index_name]" => "http-logs-%{+YYYY.MM.dd}" }
          add_field => { "source" => "http" }
        }
      }
      
      if [type] == "k8s-logs" {
        kubernetes {
          match => { "message" => "%{SYSLOGTIMESTAMP:timestamp} %{DATA:pod_name} %{GREEDYDATA:log_message}" }
        }
        mutate {
          add_field => { "[@metadata][index_name]" => "k8s-logs-%{+YYYY.MM.dd}" }
          add_field => { "source" => "kubernetes" }
        }
      }
      
      # Common filtering
      if "error" in [level] or "error" in [message] {
        mutate {
          add_tag => ["error"]
          add_field => { "severity" => "error" }
        }
      }
      
      if "warn" in [level] or "warn" in [message] {
        mutate {
          add_tag => ["warning"]
          add_field => { "severity" => "warning" }
        }
      }
      
      mutate {
        add_field => { "environment" => "production" }
        add_field => { "app_name" => "headband" }
      }
    }
    
    output {
      elasticsearch {
        hosts => ["https://elasticsearch.logging.svc.cluster.local:9200"]
        user => "elastic"
        password => "${ELASTICSEARCH_PASSWORD}"
        index => "%{[@metadata][index_name]}"
        ssl_verification_mode => "none"
        ssl_certificate_verification => false
        retry_on_conflict => 2
      }
      
      # Output errors to separate index
      if "error" in [tags] {
        elasticsearch {
          hosts => ["https://elasticsearch.logging.svc.cluster.local:9200"]
          user => "elastic"
          password => "${ELASTICSEARCH_PASSWORD}"
          index => "errors-%{+YYYY.MM.dd}"
          ssl_verification_mode => "none"
          ssl_certificate_verification => false
        }
      }
      
      # Debug output (optional)
      # stdout {
      #   codec => rubydebug
      # }
    }

---
# Logstash Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9600"
    spec:
      serviceAccountName: logstash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.10.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: tcp
            - containerPort: 5001
              name: container
            - containerPort: 5002
              name: http
            - containerPort: 9600
              name: monitoring
          env:
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: logstash-config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
            - name: logstash-tmp
              mountPath: /tmp
      volumes:
        - name: logstash-config
          configMap:
            name: logstash-config
            items:
              - key: logstash.yml
                path: logstash.yml
        - name: logstash-pipeline
          configMap:
            name: logstash-config
            items:
              - key: logstash.conf
                path: logstash.conf
        - name: logstash-tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - logstash
                topologyKey: kubernetes.io/hostname

---
# Logstash Service (TCP)
apiVersion: v1
kind: Service
metadata:
  name: logstash-tcp
  namespace: logging
  labels:
    app: logstash
spec:
  selector:
    app: logstash
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: tcp
    - port: 5001
      targetPort: 5001
      name: container
    - port: 5002
      targetPort: 5002
      name: http

---
# Logstash Service (Monitoring)
apiVersion: v1
kind: Service
metadata:
  name: logstash-monitoring
  namespace: logging
  labels:
    app: logstash
spec:
  selector:
    app: logstash
  type: ClusterIP
  ports:
    - port: 9600
      targetPort: 9600
      name: monitoring

---
# Logstash ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash
  namespace: logging

---
# Logstash RBAC Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logstash-role
  namespace: logging
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/logs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

---
# Logstash RBAC RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logstash-rolebinding
  namespace: logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: logstash-role
subjects:
  - kind: ServiceAccount
    name: logstash
    namespace: logging

---
# Logstash HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logstash-hpa
  namespace: logging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logstash
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
