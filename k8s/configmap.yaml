apiVersion: v1
kind: ConfigMap
metadata:
  name: headband-config
  namespace: headband
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  JWT_EXPIRATION: "3600"
  POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB"
  REDIS_MAX_MEMORY: "512mb"
  REDIS_POLICY: "allkeys-lru"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: headband
data:
  NEXT_PUBLIC_API_URL: "https://api.headband.app"
  NEXT_PUBLIC_WS_URL: "wss://api.headband.app"
  NEXT_TELEMETRY_DISABLED: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: headband
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
      use epoll;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

      access_log /var/log/nginx/access.log main;

      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      types_hash_max_size 2048;
      client_max_body_size 20M;

      # Gzip compression
      gzip on;
      gzip_vary on;
      gzip_min_length 1000;
      gzip_types text/plain text/css text/xml text/javascript
                 application/x-javascript application/xml+rss
                 application/json;

      # Rate limiting zones
      limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
      limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

      upstream backend {
        least_conn;
        server backend-service:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
      }

      upstream frontend {
        server frontend-service:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
      }

      # Redirect HTTP to HTTPS
      server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
      }

      server {
        listen 443 ssl http2;
        server_name api.headband.app;

        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
          limit_req zone=api_limit burst=20 nodelay;
          
          proxy_pass http://backend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 60s;
          proxy_send_timeout 60s;
          proxy_read_timeout 60s;
        }

        location /health {
          proxy_pass http://backend;
          access_log off;
        }

        location / {
          limit_req zone=general_limit burst=50 nodelay;
          
          proxy_pass http://frontend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
