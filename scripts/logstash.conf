input {
  tcp {
    port => 5000
    codec => json
    type => "app-logs"
  }
  
  tcp {
    port => 5001
    type => "container-logs"
  }
  
  http {
    port => 5002
    codec => json
    type => "http-logs"
  }
}

filter {
  if [type] == "app-logs" {
    mutate {
      add_field => { "[@metadata][index_name]" => "app-logs-%{+YYYY.MM.dd}" }
      add_field => { "source" => "application" }
    }
  }
  
  if [type] == "container-logs" {
    mutate {
      add_field => { "[@metadata][index_name]" => "container-logs-%{+YYYY.MM.dd}" }
      add_field => { "source" => "container" }
    }
  }
  
  if [type] == "http-logs" {
    mutate {
      add_field => { "[@metadata][index_name]" => "http-logs-%{+YYYY.MM.dd}" }
      add_field => { "source" => "http" }
    }
  }
  
  # Add timestamp if not present
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  # Identify error logs
  if "error" in [level] or "error" in [message] {
    mutate {
      add_tag => ["error"]
      add_field => { "severity" => "error" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
  }
  
  # Console output for debugging (optional)
  stdout {
    codec => rubydebug
  }
}
