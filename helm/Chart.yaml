apiVersion: v2
name: headband
description: Helm chart for Headband Cloud Learning Application
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - headband
  - ml
  - eeg
  - learning
  - kubernetes
home: https://github.com/headband/headband-cloudlearning-app
sources:
  - https://github.com/headband/headband-cloudlearning-app
maintainers:
  - name: Headband Team
    email: devops@headband.app
dependencies:
  - name: postgresql
    version: "13.1.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: prometheus
    version: "25.3.1"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "7.0.8"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
