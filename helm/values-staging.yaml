# Staging environment overrides

global:
  environment: staging
  domain: staging.headband.app
  apiDomain: api.staging.headband.app

backend:
  replicaCount: 2
  image:
    tag: "staging"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  env:
    LOG_LEVEL: "info"
    NODE_ENV: "staging"

frontend:
  replicaCount: 2
  image:
    tag: "staging"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
  env:
    NEXT_PUBLIC_APP_URL: "https://staging.headband.app"
    NEXT_PUBLIC_API_URL: "https://api.staging.headband.app"
  ingress:
    hosts:
      - host: staging.headband.app
        paths:
          - path: /
            pathType: Prefix

worker:
  replicaCount: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
  env:
    LOG_LEVEL: "info"

elasticsearch:
  replicaCount: 2
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  storage:
    size: 10Gi
  autoscaling:
    minReplicas: 2
    maxReplicas: 5

kibana:
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  ingress:
    host: kibana.staging.headband.app

logstash:
  replicaCount: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    minReplicas: 2
    maxReplicas: 5

monitoring:
  alerts:
    enabled: true
    email:
      recipients:
        - staging-ops@headband.app
