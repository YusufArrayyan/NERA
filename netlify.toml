[build]
  command = "cd frontend && npm run build"
  publish = "frontend/.next"

[dev]
  command = "cd frontend && npm run dev"
  port = 3000

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://chef-overlook-cocoa.ngrok-free.dev/api/:splat"
  status = 200
