  #   container_name: headband-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #     - http.cors.enabled=true
  #     - http.cors.allow-origin=*
  #   ports:
  #     - "9200:9200"
  #     - "9300:9300"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q cluster_name || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - headband-network

  # Kibana (DISABLED - removed for simplified MVP validation)
  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.10.0
  #   container_name: headband-kibana
  #   environment:
  #     ELASTICSEARCH_HOSTS: http://elasticsearch:9200
  #     ELASTICSEARCH_USERNAME: elastic
  #     ELASTICSEARCH_PASSWORD: elastic
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q green || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - headband-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: headband-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://headband:headband_password_dev@postgres:5432/headband_db
      REDIS_URL: redis://:redis_password_dev@redis:6379
      JWT_SECRET: dev_jwt_secret_key_change_in_production
      LOG_LEVEL: debug
      CACHE_TTL: 3600
      DB_POOL_SIZE: 20
    ports:
      - "3000:3000"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - headband-network

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: headband-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_ENVIRONMENT: development
      NODE_ENV: development
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/node_modules:/app/node_modules
    networks:
      - headband-network

  # Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: headband-worker
    command: npm run worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://headband:headband_password_dev@postgres:5432/headband_db
      REDIS_URL: redis://:redis_password_dev@redis:6379
      JWT_SECRET: dev_jwt_secret_key_change_in_production
      LOG_LEVEL: debug
      WORKER_CONCURRENCY: 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    networks:
      - headband-network

  # Logstash (DISABLED - removed for simplified MVP validation)
  # logstash:
  #   image: docker.elastic.co/logstash/logstash:8.10.0
