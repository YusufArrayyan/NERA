version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: headband-postgres
    environment:
      POSTGRES_USER: headband
      POSTGRES_PASSWORD: headband_password_dev
      POSTGRES_DB: headband_db
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB -U headband"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headband"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - headband-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: headband-redis
    command: redis-server --appendonly yes --requirepass redis_password_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - headband-network

  # Elasticsearch (DISABLED - removed for simplified MVP validation)
